# Populate /home/slate from /etc/skel on first boot.
#
# The slate user is created via sysusers.d (see etc/sysusers.d/slate.conf),
# which — unlike useradd — never creates or populates a home directory.
# /etc/skel is the single source of truth for Slate's default dotfiles
# (Hyprland/ghostty/vicinae config), shared with archinstall's target
# systems where useradd's normal skel-copy behavior applies automatically.
# This "C" line does the equivalent copy for the live ISO's own slate user:
# it only fires if /home/slate doesn't already exist.
#
# Type Path        Mode UID   GID   Age Argument
C      /home/slate 0750 slate slate -   /etc/skel
