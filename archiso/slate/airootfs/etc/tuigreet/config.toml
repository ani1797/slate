[display]
show_time = true
time_format = "%A, %d %B %Y · %H:%M"
greeting = "Welcome to Slate"
align_greeting = "center"
issue = false

[layout]
width = 72
window_padding = 2
container_padding = 2
prompt_padding = 1

[layout.widgets]
time_position = "top"
status_position = "bottom"

[user_menu]
enabled = true
min_uid = 1000
max_uid = 1000

[secret]
mode = "characters"
characters = "•"

# Tuigreet keybindings are F-key numbers.
[keybindings]
command = 2
sessions = 3
background = 4
power = 12

[background]
kind = "matrix"
fps = 24

# Match Slate's shared dark palette from Ghostty/Vicinae: cyan accent over the
# same deep blue-black base, kept below 30 FPS so the greeter stays lightweight.
[background.matrix]
head_color = "#F2F7FF"
bright_color = "#62E6FF"
dim_color = "#263A52"
min_length = 6
max_length = 18
min_speed = 0.25
max_speed = 0.95
mutate_chance = 0.02

[session]
sessions_dirs = ["/usr/share/wayland-sessions"]
xsessions_dirs = []
environments = []

[power]
use_setsid = true

[theme]
# ANSI names are resolved through the active terminal palette, which is Slate's
# Ghostty-compatible palette on the live ISO.
border = "cyan"
text = "white"
time = "cyan"
container = "black"
title = "cyan"
greet = "bright-cyan"
prompt = "bright-blue"
input = "white"
action = "bright-cyan"
button = "bright-blue"
