[storage]
# Pin the storage driver explicitly. podman would auto-detect "overlay" here
# anyway on a standard Linux kernel, but pinning it keeps behavior predictable
# rather than relying on runtime auto-detection.
driver = "overlay"

[storage.options.overlay]
# The live ISO's own root filesystem is itself an overlay (squashfs/erofs +
# tmpfs cow), so the kernel's native overlay driver cannot mount
# overlay-on-overlay for container storage - confirmed by boot-testing
# ("'overlay' is not supported over overlayfs: backing file system is
# unsupported for this graph driver"). fuse-overlayfs is podman's own
# documented solution for exactly this backing-filesystem case.
mount_program = "/usr/bin/fuse-overlayfs"
