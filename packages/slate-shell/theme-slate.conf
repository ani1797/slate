# Slate's default terminal palette. Mirrors the "Slate" color scheme in
# packages/slate-launcher/slate.toml so Ghostty and the Vicinae launcher
# read as one consistent theme.
#
# To retheme: point `config-file` in ./config at a different palette file
# with this same set of directives instead of editing this file in place.

background = 0A0E16
foreground = F2F7FF

cursor-color = 62E6FF
cursor-text = 05080D

selection-background = 62E6FF
selection-foreground = 05080D

# Standard ANSI (0-7)
palette = 0=#101827
palette = 1=#FF6B7A
palette = 2=#56E39F
palette = 3=#F7D774
palette = 4=#4CA6FF
palette = 5=#E879F9
palette = 6=#62E6FF
palette = 7=#9AABC0

# Bright ANSI (8-15)
palette = 8=#263A52
palette = 9=#FF6B7A
palette = 10=#56E39F
palette = 11=#F7D774
palette = 12=#4CA6FF
palette = 13=#A78BFA
palette = 14=#62E6FF
palette = 15=#F2F7FF
