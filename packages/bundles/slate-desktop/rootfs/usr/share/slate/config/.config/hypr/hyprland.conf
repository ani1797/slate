# Minimal Hyprland config for Slate's live ISO.
#
# Intentionally small: just enough to have a usable, terminal-first session.
# Not a dotfiles project — extend only when a concrete need shows up.

monitor = , preferred, auto, auto

input {
    kb_layout = us
}

$mod = SUPER
$term = ghostty
$launcher = vicinae toggle

# Open a terminal on login so there's always a way in.
exec-once = $term

# Export the Wayland session before starting the launcher daemon. Keeping this
# in one command prevents Vicinae from racing the systemd environment import.
exec-once = sh -c 'systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE && dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE && systemctl --user start vicinae.service'

# Notification daemon — required for slate-capture's screenshot/recording
# confirmations.
exec-once = mako

bind = $mod, Return, exec, $term
bind = $mod, Space, exec, $launcher
bind = $mod, Q, killactive,
bind = $mod SHIFT, M, exit,
bind = $mod, V, togglefloating,
bind = $mod, F, fullscreen,

# Screenshots (slate-capture): default to clipboard-only; Ctrl variants
# additionally save a timestamped file to ~/Pictures/Screenshots.
bind = , Print, exec, slate-capture screenshot full
bind = SHIFT, Print, exec, slate-capture screenshot region
bind = $mod, Print, exec, slate-capture screenshot window
bind = $mod SHIFT, Print, exec, slate-capture screenshot region --edit
bind = CTRL, Print, exec, slate-capture screenshot full --save
bind = CTRL SHIFT, Print, exec, slate-capture screenshot region --save

# Screen recording (slate-capture): each bind toggles start/stop. Video is
# always saved to ~/Videos/Recordings — there's no clipboard target for it.
bind = $mod, R, exec, slate-capture record toggle region
bind = $mod SHIFT, R, exec, slate-capture record toggle full

# Switch/move to workspaces 1-9.
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
