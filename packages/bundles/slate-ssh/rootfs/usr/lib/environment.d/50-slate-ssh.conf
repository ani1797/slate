# Point every systemd user service and graphical session at the per-user
# ssh-agent socket that /usr/lib/systemd/user/ssh-agent.socket (from openssh)
# listens on. %t in that unit is $XDG_RUNTIME_DIR, so this is the same path
# ssh-agent.service's own header comment and the Arch Wiki both document —
# Slate defines no socket path of its own.
#
# /etc/profile.d/slate-ssh-agent.sh carries the equivalent for login shells,
# which environment.d does not reach.
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/ssh-agent.socket
SSH_ASKPASS=/usr/bin/lxqt-openssh-askpass
