# Slate's sshd defaults: key-only authentication.
#
# openssh's own /etc/ssh/sshd_config includes this directory after its
# defaults, and sshd_config is first-obtained-value-wins, so this 50- file
# takes effect over openssh's own 99-archlinux.conf where they overlap
# (KbdInteractiveAuthentication no is set by both; no conflict).
#
# Deliberately not pinning Ciphers/MACs/KexAlgorithms: upstream OpenSSH's
# defaults are already strong and are curated per release, so a frozen list
# here would only age into a liability.

# No password is ever provisioned by Slate for remote login: a key must be
# placed in ~/.ssh/authorized_keys before sshd is reachable at all.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no

# Root must always come in as a normal user and elevate locally (sudo), never
# authenticate over the network directly.
PermitRootLogin no

# No GUI forwarding needed for a headless-capable server role.
X11Forwarding no

# Narrow the window an unauthenticated connection gets to misbehave.
MaxAuthTries 3
LoginGraceTime 20
