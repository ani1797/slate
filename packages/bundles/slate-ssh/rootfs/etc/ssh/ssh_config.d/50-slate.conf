# Slate's SSH client defaults, applied to every user via the Include line
# already present in openssh's own /etc/ssh/ssh_config.
Host *
    # Populate the running agent from the first successful use of a key,
    # rather than once per connection. This is the Arch Wiki's own
    # recommendation and is what makes an always-on agent actually earn its
    # keep. Covers ssh, scp, and any client built on libssh/OpenSSH (git
    # included).
    AddKeysToAgent yes

    # Store known_hosts entries hashed so a stolen or synced known_hosts file
    # is not a plaintext inventory of every host reachable from this machine.
    HashKnownHosts yes
