# Search registry for unqualified (short) image names, e.g. `podman pull ubuntu`.
#
# Deliberately a single entry: Podman/Red Hat's own guidance is to avoid multiple
# unqualified-search-registries, since it lets a short name silently resolve
# against whichever registry has that name first - a name-squatting risk. Any
# other registry (ghcr.io, quay.io, ...) is still fully usable, just via a
# fully-qualified reference (e.g. `podman pull ghcr.io/org/image`), which needs
# no entry here.
#
# Shipped as a registries.conf.d drop-in rather than as a whole registries.conf:
# containers-common owns the defaults, and a drop-in leaves /etc/containers/
# registries.conf free for the admin without ever producing a .pacnew.
unqualified-search-registries = ["docker.io"]
