[storage]
# Pin the storage driver explicitly. podman would auto-detect "overlay" here
# anyway on a standard Linux kernel, but pinning it keeps behavior predictable
# rather than relying on runtime auto-detection.
#
# Note this is the *vendor default* location, alongside the drop-in
# containers-common itself ships. The live ISO overrides it with a full
# /etc/containers/storage.conf, because a live root is an overlay and the kernel
# overlay driver cannot mount overlay-on-overlay; an installed system has a real
# filesystem underneath and uses the faster native driver.
driver = "overlay"
